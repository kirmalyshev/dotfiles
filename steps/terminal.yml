---

- clean: ['~']

# See https://ohmyz.sh
- shell:
    - command: |
        sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" || true
      description: Install Oh-My-Zsh
      stdout: true
      stderr: true

- link:
  # Terminal:
    ~/.shell:
      path: shell
      create: true
    ~/.bash_profile: config/bash_profile
    ~/.bashrc: config/bashrc
    ~/.zshrc:
      path: config/zshrc
      force: true
    ~/.zshenv:
      path: config/zshenv
      force: true

    ~/.hushlogin: config/hushlogin
    ~/.inputrc: config/inputrc
    # Ghostty:
    ~/Library/Application Support/com.mitchellh.ghostty/config:
      path: config/ghostty
      force: true
      create: true

    # Kitty:
    ~/.config/kitty/kitty.conf:
      path: config/kitty/kitty.conf
      force: true
      create: true

    # iTerm2:
    ~/Library/Preferences/com.googlecode.iterm2.plist:
      path: iterm2/com.googlecode.iterm2.plist
      force: true

    # Git:
    ~/.gitconfig: config/gitconfig
    ~/.gitignore_global: config/gitignore
    ~/.gitattributes_global: config/gitattributes

    # Tools:
    ~/.psqlrc: config/psqlrc
    ~/.sqliterc: config/sqliterc

    # Editors:
    ~/.editorconfig: config/editorconfig
    ~/.nanorc: config/nanorc

    # SSH:
    ~/.ssh/config:
      path: config/ssh_config
      force: true
      create: true

    # GPG:
    ~/.gnupg/gpg-agent.conf:
      path: config/gpgagent
      force: true
      create: true

    # skhd:
    ~/.skhdrc:
      path: config/skhdrc
      force: true

    # Remote browser: links opened on a Linux box attached through
    # `herdr --remote` open here. launchd reads the plist at login, or at the
    # bootstrap below.
    ~/Library/LaunchAgents/com.kirmalyshev.remote-browser.plist:
      path: macos/LaunchAgents/com.kirmalyshev.remote-browser.plist
      create: true

# Load it now rather than at next login, and reload it after an edit.
- shell:
    - command: |
        [ "$(uname)" = Darwin ] || exit 0
        u="gui/$(id -u)"
        launchctl bootout "$u/com.kirmalyshev.remote-browser" 2>/dev/null
        launchctl bootstrap "$u" "$HOME/Library/LaunchAgents/com.kirmalyshev.remote-browser.plist"
      description: Load the remote-browser listener
      stdout: true
      stderr: true
